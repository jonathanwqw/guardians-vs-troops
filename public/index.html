<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<link rel="manifest" href="manifest.json">
<title>Guardians vs Troops</title>
<style>
  @font-face { font-family: "FonteJogo"; src: url("fontes/FreeSansBold.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e3e7ef; }
  body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* o palco: no celular em pé ele gira 90° para o jogo ficar SEMPRE na horizontal */
  #palco { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; }
  #tela { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* campos de texto do multiplayer: ficam em cima da caixa desenhada pelo jogo */
  .campo-jogo { position: absolute; margin: 0; padding: 0; border: 0; outline: 0; background: transparent; color: #1f2937;
    font-family: "FonteJogo", "FreeSans", Arial, Helvetica, sans-serif; font-weight: normal; box-sizing: border-box;
    -webkit-user-select: text; user-select: text; border-radius: 0; -webkit-appearance: none; appearance: none; }
  .campo-jogo::placeholder { color: #9aa3b4; opacity: 1; }
  .campo-jogo:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #fff inset; -webkit-text-fill-color: #1f2937; }
  #erro { display: none; position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 12px 14px; background: #1f2937; color: #fff;
    font: 15px/1.4 Arial, Helvetica, sans-serif; border-radius: 8px; }
</style>
</head>
<body>
<div id="palco"><canvas id="tela" tabindex="0"></canvas></div>
<div id="erro"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
